  <style>
    /* 单入口预览：仅调整现有风格的空间布局 */
    .page-top {
      min-height: calc(100vh - 76px);

    }
    header.main-header { margin-bottom: clamp(30px, 5vh, 52px); }
    .hero-section { margin-bottom: 34px; }
    .grid-container {
      grid-template-columns: minmax(0, 1fr);

    }
    .favorite-card {
      min-height: 148px;

    .card-icon { width: 32px; height: 32px; }
    .card-title { font-size: 16px; font-weight: 400; }
    .card-note {

      letter-spacing: .04em;
      color: var(--text-tertiary);
      position: relative;
      z-index: 1;

    .favorite-card:hover .card-note { color: var(--text-secondary); }
