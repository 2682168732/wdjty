  <!-- 诗词轮播脚本 -->
  <script type="text/javascript">
    (function() {
      // 预定义的精选诗词（作为备选和初始展示）
      var defaultPoems = [
        "海内存知己，天涯若比邻",
        "人生若只如初见，何事秋风悲画扇",
        "众里寻他千百度，蓦然回首，那人却在灯火阑珊处",
        "路漫漫其修远兮，吾将上下而求索",
        "长风破浪会有时，直挂云帆济沧海",
        "落霞与孤鹜齐飞，秋水共长天一色",
        "会当凌绝顶，一览众山小",
        "大江东去，浪淘尽，千古风流人物",
        "春风得意马蹄疾，一日看尽长安花",
        "采菊东篱下，悠然见南山",
        "莫愁前路无知己，天下谁人不识君",
        "天生我材必有用，千金散尽还复来",
        "山重水复疑无路，柳暗花明又一村",
        "欲穷千里目，更上一层楼",
        "不识庐山真面目，只缘身在此山中",
        "纸上得来终觉浅，绝知此事要躬行",
        "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生",
        "水光潋滟晴方好，山色空蒙雨亦奇",
        "问渠那得清如许，为有源头活水来",
        "接天莲叶无穷碧，映日荷花别样红"
      ];
      
      // 诗词池（包含预定义和API获取的）
      var poems = [...defaultPoems];
      var searchInput = document.getElementById('txt');
      var changeInterval = 6000; // 每6秒更换一次
      var currentIndex = 0;
      var isLoading = false;
      
      // 从API获取诗词
      function fetchPoem() {
        if (isLoading || typeof jinrishici === 'undefined') return null;
        
        isLoading = true;
        
        return new Promise(function(resolve) {
          jinrishici.load(function(result) {
            if (result && result.data && result.data.content) {
              // 提取诗句（去掉标题和作者）
              var poem = result.data.content.trim();
              isLoading = false;
              resolve(poem);
            } else {
              isLoading = false;
              resolve(null);
            }
          }, function(error) {
            console.log('获取诗词失败:', error);
            isLoading = false;
            resolve(null);
          });
        });
      }
      
      // 显示诗词到搜索框placeholder
      function showPoem(text) {
        if (!searchInput) return;
        searchInput.placeholder = text;
      }
      
      // 更换到下一首诗词
      async function nextPoem() {
        if (!searchInput) return;
        
        // 尝试从API获取新诗词
        var apiPoem = await fetchPoem();
        
        if (apiPoem) {
          // API获取成功，添加到诗词池并使用
          if (!poems.includes(apiPoem)) {
            poems.push(apiPoem);
          }
          showPoem(apiPoem);
        } else {
          // API失败，使用诗词池中的下一首
          currentIndex = (currentIndex + 1) % poems.length;
          showPoem(poems[currentIndex]);
        }
      }
      
      // 初始化：优先从API获取今日诗词
      async function initPoem() {
        var apiPoem = await fetchPoem();
        
        if (apiPoem) {
          // API获取成功，添加到诗词池并显示
          if (!poems.includes(apiPoem)) {
            poems.push(apiPoem);
          }
          showPoem(apiPoem);
        } else {
          // API失败，随机选择一首预定义诗词
          var randomIndex = Math.floor(Math.random() * defaultPoems.length);
          currentIndex = randomIndex;
          showPoem(defaultPoems[randomIndex]);
        }
      }
      
      // 执行初始化
      initPoem();
      
      // 启动定时轮播
      setInterval(nextPoem, changeInterval);
      
      // 预加载一些API诗词
      setTimeout(function() {
        for (var i = 0; i < 3; i++) {
          setTimeout(function() {
            fetchPoem();
          }, i * 1000);
        }
      }, 1000);
    })();
  </script>

  <!-- 性能优化：页面加载和图片懒加载 -->
  <script type="text/javascript">
    (function() {
      // 页面加载完成处理
      window.addEventListener('load', function() {
        var loader = document.getElementById('page-loader');
        var mainContent = document.getElementById('main-content');
        
        if (loader && mainContent) {
          // 模拟加载延迟，让用户看到骨架屏效果
          setTimeout(function() {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.5s ease-out';
            
            setTimeout(function() {
              loader.style.display = 'none';
              mainContent.style.display = 'block';
              
              // 触发淡入动画
              mainContent.classList.add('fade-in');
            }, 500);
          }, 800);
        }
      });

      // 图片懒加载
      function lazyLoadImages() {
        var images = document.querySelectorAll('img[data-src]');
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var img = entry.target;
              img.src = img.getAttribute('data-src');
              img.onload = function() {
                img.classList.add('loaded');
              };
              observer.unobserve(img);
            }
          });
        });
        
        images.forEach(function(img) {
          observer.observe(img);
        });
      }

      // 为所有现有图片添加懒加载
      function setupExistingImages() {
        var images = document.querySelectorAll('img');
        images.forEach(function(img) {
          if (!img.hasAttribute('data-src') && img.src) {
            img.setAttribute('data-src', img.src);
            img.classList.add('loaded');
          }
        });
      }

      // 初始化
      setupExistingImages();
      lazyLoadImages();
    })();
  </script>

  <!-- 工具抽屉交互 -->
  <script type="text/javascript">
    // 切换抽屉展开/收起
    function toggleDrawer() {
      var drawer = document.getElementById('toolDrawer');
      var arrow = document.querySelector('.drawer-arrow');
      
      if (drawer) {
        drawer.classList.toggle('open');
        if (arrow) {
          arrow.style.transform = drawer.classList.contains('open') ? 'rotate(180deg)' : 'rotate(0deg)';
        }
      }
    }

    // 初始化抽屉状态
    document.addEventListener('DOMContentLoaded', function() {
      var drawer = document.getElementById('toolDrawer');
      var arrow = document.querySelector('.drawer-arrow');
      
      // 如果抽屉默认打开，设置箭头旋转
      if (drawer && drawer.classList.contains('open') && arrow) {
        arrow.style.transform = 'rotate(180deg)';
      }
    });
  </script>

  <script type="text/javascript">
    (function() {
      // 检查ThinkPHP调试工具元素是否存在，如果不存在则跳过
      var traceTabTit = document.getElementById('think_page_trace_tab_tit');
      var traceTabCont = document.getElementById('think_page_trace_tab_cont');
      var traceOpen = document.getElementById('think_page_trace_open');
      var traceCloseElement = document.getElementById('think_page_trace_close');
      
      if (!traceTabTit || !traceTabCont || !traceOpen || !traceCloseElement) {
        return; // 元素不存在，跳过执行
      }
      
      var tab_tit = traceTabTit.getElementsByTagName('span');
      var tab_cont = traceTabCont.getElementsByTagName('div');
      var open = traceOpen;
      var close = traceCloseElement.children[0];
      var trace = document.getElementById('think_page_trace_tab');
      var cookie = document.cookie.match(/thinkphp_show_page_trace=(\d\|\d)/);
      var history = (cookie && typeof cookie[1] != 'undefined' && cookie[1].split('|')) || [0, 0];
      
      if (open) {
        open.onclick = function() {
          trace.style.display = 'block';
          this.style.display = 'none';
          close.parentNode.style.display = 'block';
          history[0] = 1;
          document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
        }
      }
      
      if (close) {
        close.onclick = function() {
          trace.style.display = 'none';
          this.parentNode.style.display = 'none';
          open.style.display = 'block';
          history[0] = 0;
          document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
        }
      }
      
      for (var i = 0; i < tab_tit.length; i++) {
        tab_tit[i].onclick = (function(i) {
          return function() {
            for (var j = 0; j < tab_cont.length; j++) {
              tab_cont[j].style.display = 'none';
              tab_tit[j].style.color = '#999';
            }
            tab_cont[i].style.display = 'block';
            tab_tit[i].color = '#000';
            history[1] = i;
            document.cookie = 'thinkphp_show_page_trace=' + history.join('|')
          }
        })(i)
      }
      parseInt(history[0]) && open && open.click();
      tab_tit[history[1]] && tab_tit[history[1]].click();
    })();
  </script>
